<!DOCTYPE html>
<html lang="en">


    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <title>Tailwind Cards</title>


    </head>


    <body class="flex min-h-screen justify-center items-center box-border bg-[#F2F5FA]
">
        <div class="container max-w-69 border-0 rounded-2xl bg-white shadow-xl">
            
            <div class="relative overflow-hidden rounded-2xl">
                <img src="/images/hero-image.jpg" class=" w-full h-full object-cover" alt="..." />

                <svg viewBox="0 0 300 50" xmlns="http://www.w3.org/2000/svg"
                    class="absolute bottom-[-2px] left-0 w-full h-14">
                    <path d="M0,40 C60,20 120,65 180,30 C240,0 280,39 300,40 L300,60 L0,60 Z" fill="white" />
                </svg>
            </div>

            <!-- -----------Content----------- -->
            <div class="content py-2 px-5">
                <p class="text-lg font-bold">Perfect solution for small business</p>
                <p class="text-xs text-gray-600 my-[15px] leading-5">
                    Small business need to generate leads to grow. You can use tools like Ringy.
                </p>
            </div>

            <!-- ---------------------- -->
            <hr class="border-0 h-[1px] bg-gray-200">


            <!-- ----------footer------------ -->
            <div class="flex gap-3 py-4 px-5">
                <!-- footer round image -->
                <div class="rounded-full overflow-hidden border-3 border-gray-200 w-11 my-auto">
                    <img src="images/avatar.png" alt="" class=" w-full h-full ">
                </div> 
                <!-- footer content -->
                <div class="my-auto">
                    <p class="font-bold text-xs">Amy Burgess</p>
                    <p class="text-[10px]">Customer Manager, Solution Oy</p>
                </div>
            </div>
            <!-- ---------------------- -->
        </div>
        <!-- ---------------------- -->

    </body>

</html>
